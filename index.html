<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Finance Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-title">
                <h1>Finance Tracker</h1>
                <button id="settingsBtn" class="btn btn-icon" title="Settings">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                </button>
            </div>
        </header>

        <main>
            <section class="total-section" id="totalSection">
                <div id="totalValue" class="total-value clickable">$0.00</div>
                <div id="totalChange" class="total-change"></div>
                <div class="total-actions">
                    <button id="enterDataBtn" class="btn btn-primary btn-enter">+ Enter Data</button>
                    <button id="importBtn" class="btn btn-icon-outline" title="Import CSV">
                        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                    </button>
                    <input type="file" id="importFile" accept=".csv" hidden>
                    <button id="exportBtn" class="btn btn-icon-outline" title="Export CSV">
                        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>
                    </button>
                </div>
                <div id="accountBreakdown" class="account-breakdown">
                    <div id="activeAccountsList" class="accounts-list"></div>
                    <div id="closedAccountsToggle" class="closed-accounts-toggle">Closed accounts</div>
                    <div id="closedAccountsList" class="accounts-list closed-accounts-list"></div>
                    <div class="legend-actions">
                        <button id="showAllBtn" class="btn-link">Show all</button>
                        <button id="hideAllBtn" class="btn-link">Hide all</button>
                    </div>
                </div>
            </section>

            <section class="chart-section">
                <div class="section-header">
                    <h2>Asset History</h2>
                    <label class="checkbox-label">
                        <input type="checkbox" id="zeroBasedCheckbox" checked>
                        Zero-based
                    </label>
                </div>
                <div class="chart-controls">
                    <div class="time-range-buttons">
                        <button class="time-range-btn" data-range="1">1Y</button>
                        <button class="time-range-btn" data-range="3">3Y</button>
                        <button class="time-range-btn" data-range="5">5Y</button>
                        <button class="time-range-btn active" data-range="all">All</button>
                    </div>
                    <button id="resetZoomBtn" class="btn-link">Reset zoom</button>
                </div>
                <div class="chart-container">
                    <canvas id="assetChart"></canvas>
                </div>
                <div id="noDataMessage" class="no-data-message">No data yet. Click "Enter Data" to start tracking.</div>
            </section>

            <section class="table-section">
                <h2>Data Table</h2>
                <div class="table-wrapper">
                    <table id="dataTable">
                        <thead>
                            <tr id="tableHeader"></tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- Data Entry Modal -->
    <div id="dataModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Enter Data</h2>
                <button class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="date-picker">
                    <label for="entryDate">Date:</label>
                    <input type="date" id="entryDate">
                </div>
                <div id="accountInputs" class="account-inputs"></div>
                <div class="add-account">
                    <input type="text" id="newAccountName" placeholder="New account name...">
                    <button id="addAccountBtn" class="btn btn-secondary">Add Account</button>
                </div>
            </div>
            <div class="modal-footer">
                <button id="cancelBtn" class="btn btn-secondary">Cancel</button>
                <button id="saveBtn" class="btn btn-primary">Save</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
        <div class="modal-content modal-small">
            <div class="modal-header">
                <h2>Settings</h2>
                <button class="close-btn" data-close="settingsModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="setting-row">
                    <label for="currencySelect">Currency</label>
                    <select id="currencySelect">
                        <option value="USD">USD ($)</option>
                        <option value="EUR">EUR (€)</option>
                        <option value="GBP">GBP (£)</option>
                        <option value="JPY">JPY (¥)</option>
                        <option value="CHF">CHF (Fr)</option>
                        <option value="CAD">CAD ($)</option>
                        <option value="AUD">AUD ($)</option>
                        <option value="CNY">CNY (¥)</option>
                        <option value="CZK">CZK (Kč)</option>
                    </select>
                </div>
                <div class="setting-row setting-row-danger">
                    <label>Clear all data</label>
                    <button id="clearDataBtn" class="btn btn-danger">Clear</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Tooltip for comments -->
    <div id="tooltip" class="tooltip"></div>

    <!-- Templates -->
    <template id="accountBreakdownItemTemplate">
        <div class="account-breakdown-item" data-account-id="">
            <div class="account-name-wrapper">
                <span class="account-color"></span>
                <span class="account-breakdown-name"></span>
            </div>
            <span class="account-breakdown-value"></span>
        </div>
    </template>

    <template id="accountInputTemplate">
        <div class="account-input" data-account-id="">
            <div class="account-input-header">
                <label></label>
                <button type="button">Close account</button>
            </div>
            <input type="number" step="0.01" placeholder="Value">
            <input type="text" placeholder="Comment (optional)">
        </div>
    </template>

    <script src="app.js"></script>
</body>
</html>
